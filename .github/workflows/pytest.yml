name: CI - pytest

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with requires-python and the classifiers in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Smoke-test installed command
        run: pdf-text-miner -f lorem-ipsum.pdf -t "lorem ipsum" --ignore-case

  wheel:
    # The test job installs the checkout in editable mode; this checks the real distribution.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Install wheel in a clean environment and run it outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv venv
          venv/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          venv/bin/pdf-text-miner --version
          venv/bin/pdf-text-miner -f "$GITHUB_WORKSPACE/lorem-ipsum.pdf" -t "lorem ipsum" --ignore-case
