[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-text-miner"
dynamic = ["version"]
description = "Small CLI that searches for a phrase in PDF files and reports matches per page."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kris M. Poltorak" }]
requires-python = ">=3.10"
dependencies = ["pypdf>=5.0"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing",
]

[project.optional-dependencies]
# Tools for development only; ReportLab generates the PDFs used in tests.
dev = ["pytest>=8", "reportlab>=4", "ruff>=0.15"]

[project.scripts]
pdf-text-miner = "pdf_text_miner:main"

[project.urls]
Homepage = "https://github.com/kmpoltorak/pdf-text-miner"

[tool.setuptools]
# main.py is only a compatibility shim for running from a checkout; it is not installed.
py-modules = ["pdf_text_miner"]

[tool.setuptools.dynamic]
version = { attr = "pdf_text_miner.__version__" }

[tool.pytest.ini_options]
testpaths = ["test_main.py"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
